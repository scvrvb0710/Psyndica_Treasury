[project]
name = "sats-engine"
version = "0.1.0"
description = "BTC-denominated swing/scalp research engine with block-explorer pressure signals (shadow mode only)"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
sats-engine = "sats_engine.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sats_engine*"]
