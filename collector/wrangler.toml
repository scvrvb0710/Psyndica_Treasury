name = "sats-collector"
main = "src/index.js"
compatibility_date = "2026-10-01"
workers_dev = true

# Watchdog: check for stale data every 5 minutes.
[triggers]
crons = ["*/5 * * * *"]

[vars]
STALE_SECONDS = "600"

[[d1_databases]]
binding = "DB"
database_name = "sats-collector"
database_id = "3993d13c-6b60-4ba3-bc23-bff729215369"

# Secrets - set with `npx wrangler secret put <NAME>`, never commit them:
#   COLLECTOR_SECRET  (required) 32+ random chars, shared with the scanner
#   ALERT_WEBHOOK     (optional) Slack-compatible incoming webhook URL
